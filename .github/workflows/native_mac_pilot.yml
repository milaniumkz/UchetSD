name: Native Mac Pilot

on:
  push:
    branches: [codex/mac-ci-pilot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mac-UchetSD-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter:
    name: Flutter checks
    if: github.repository == 'milaniumkz/UchetSD' && (github.ref == 'refs/heads/codex/mac-ci-pilot' || github.ref == 'refs/heads/main')
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["milanium-mac-arm64", "repo-UchetSD"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: github.event_name == 'pull_request'
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - name: Select installed Mac Flutter
        if: github.event_name != 'pull_request'
        run: |
          echo /Volumes/PD1000/job/flutter/bin >> "$GITHUB_PATH"
          /Volumes/PD1000/job/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; assert json.load(sys.stdin)["frameworkVersion"] == "3.41.1"'
      - run: flutter pub get ${{ github.event_name != 'pull_request' && '--enforce-lockfile' || '' }}
      - run: flutter test
      - run: flutter build web --release --no-wasm-dry-run

  functions:
    name: Firebase Functions checks
    if: github.repository == 'milaniumkz/UchetSD' && (github.ref == 'refs/heads/codex/mac-ci-pilot' || github.ref == 'refs/heads/main')
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["milanium-mac-arm64", "repo-UchetSD"]') || fromJSON('["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: firebase/functions
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - name: Select installed Mac Node 20
        if: github.event_name != 'pull_request'
        run: |
          echo /opt/homebrew/opt/node@20/bin >> "$GITHUB_PATH"
          /opt/homebrew/opt/node@20/bin/node -e 'if (process.versions.node.split(".")[0] !== "20") process.exit(1)'
      - run: npm ci
      - run: npm run lint
